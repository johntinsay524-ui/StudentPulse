<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign up — Student Pulse</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<main class="authwrap">
  <form class="card authcard" id="signupForm">
    <h1>Student Pulse</h1>
    <p class="sub">Create your student account</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" maxlength="20" required>
    <label for="email">Email (we send a confirmation link)</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password (8+ characters)</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
    <div class="err" id="err" role="alert"></div>
    <div class="notice" id="notice" role="status"></div>
    <button class="post-btn">Sign up</button>
    <p class="alt">Teacher or staff? Ask a moderator to create your account.</p>
    <p class="alt">Already have an account? <a href="login.html">Log in</a></p>
    <p class="alt"><a href="about.html">About &amp; terms</a></p>
  </form>
</main>
<script src="store.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="sb.js"></script>
<script src="auth.js"></script>
<script src="auth-pages.js"></script>
</body>
</html>
