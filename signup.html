<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign up — Student Pulse</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<main class="authwrap">
  <form class="card authcard" id="signupForm">
    <img src="logo.png" alt="Student Pulse logo" width="72" height="72" style="display:block;margin:0 auto 10px">
    <h1 style="text-align:center">Student Pulse</h1>
    <p class="sub" style="text-align:center">Create your account</p>
    <label for="role">I am a</label>
    <select id="role" name="role" required>
      <option value="student" selected>Student</option>
      <option value="teacher">Teacher</option>
      <option value="staff">Staff</option>
    </select>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" maxlength="20" required>
    <label for="email">Email (we send a confirmation link)</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password (8+ characters)</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
    <div class="err" id="err" role="alert"></div>
    <div class="notice" id="notice" role="status"></div>
    <button class="post-btn">Sign up</button>
    <p class="alt">Already have an account? <a href="login.html">Log in</a></p>
    <p class="alt"><a href="about.html">About &amp; terms</a></p>
  </form>
</main>
<script src="store.js"></script>
<script src="dialog.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="sb.js"></script>
<script src="auth.js"></script>
<script src="auth-pages.js"></script>
</body>
</html>
