<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in — Student Pulse</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<main class="authwrap">
  <form class="card authcard" id="loginForm">
    <h1>Student Pulse</h1>
    <p class="sub">Log in to the student board</p>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="err" id="err" role="alert"></div>
    <div class="notice" id="notice" role="status"></div>
    <button class="post-btn">Log in</button>
    <p class="alt"><a href="forgot.html">Forgot your password?</a></p>
    <p class="alt">New here? <a href="signup.html">Create an account</a></p>
    <p class="alt"><a href="about.html">About &amp; terms</a></p>
  </form>
</main>
<script src="store.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="sb.js"></script>
<script src="auth.js"></script>
<script src="auth-pages.js"></script>
</body>
</html>
